
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>我的任务管理系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f6f7fb;
            color: #25283b;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #ffffff;
            padding: 30px 20px;
            border-right: 1px solid #eeeeF3;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .nav-item {
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            color: #73768a;
        }

        .nav-item.active {
            background: #eef0ff;
            color: #6258dc;
            font-weight: bold;
        }

        .main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 16px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #9295a7;
            font-size: 14px;
        }

        .date {
            color: #777b90;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #eeeef4;
        }

        .stat-label {
            color: #85889b;
            font-size: 14px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 14px;
        }

        .task-panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #eeeef4;
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .panel-heading h2 {
            font-size: 19px;
            margin: 0;
        }

        .add-button {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            background: #6258dc;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 0;
            border-top: 1px solid #f0f0f5;
        }

        .task-item input {
            width: 17px;
            height: 17px;
            accent-color: #6258dc;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 15px;
            margin-bottom: 7px;
        }

        .task-course {
            font-size: 12px;
            color: #9295a7;
        }

        .task-status {
            color: #d18b35;
            background: #fff5e6;
            padding: 6px 10px;
            border-radius: 7px;
            font-size: 12px;
        }

        .task-item.done .task-title {
            color: #a1a3b1;
            text-decoration: line-through;
        }

        .task-item.done .task-status {
            color: #26845b;
            background: #e7f7ef;
        }
        .subtitle {
            color: #7c83fd;
            font-size: 16px;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .main {
                padding: 22px 16px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">✦ 学习空间</div>
        <div class="nav-item active">▦ 任务总览</div>
        <div class="nav-item">◷ 今日任务</div>
        <div class="nav-item">✓ 已完成</div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>我的任务管理系统</h1>
                <div class="subtitle">把每一件小事，慢慢做好。</div>

            </div>
            <div class="date">Study Dashboard</div>
        </div>

        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">全部任务</div>
                <div class="stat-number">3</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完成</div>
                <div class="stat-number">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">完成进度</div>
                <div class="stat-number">33%</div>
            </div>
        </section>

        <section class="task-panel">
            <div class="panel-heading">
                <h2>任务列表</h2>
                <button class="add-button" id="addTaskBtn">+ 添加任务</button>
            </div>
            <div id="taskList">
            <div class="task-item done">
                <input type="checkbox" checked>
                <div class="task-info">
                    <div class="task-title">完成 Java 基础复习</div>
                    <div class="task-course">Java 程序设计</div>
                </div>
                <span class="task-status">已完成</span>
            </div>

            <div class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <div class="task-title">整理数据库实验报告</div>
                    <div class="task-course">数据库原理</div>
                </div>
                <span class="task-status">进行中</span>
            </div>

            <div class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <div class="task-title">预习数据结构课程</div>
                    <div class="task-course">数据结构</div>
                </div>
                <span class="task-status">进行中</span>
                </div>
            </div>>
        </section>
    </main>
</div>
<script>
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");

    // 读取以前保存的默认任务；
    let tasks = JSON.parse(localStorage.getItem("tasks"));

    if (tasks === null)
    {
        tasks = [
            { name: "完成 Java 基础复习", completed: true },
            { name: "整理数据库实验报告", completed: false },
            { name: "预习数据结构课程", completed: false }
        ];

        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // 把任务显示到网页上
    function renderTasks()
    {
        taskList.innerHTML = "";

        tasks.forEach(function(task)
        {
            const newTask = document.createElement("div");
            newTask.className = task.completed ? "task-item done" : "task-item";

            newTask.innerHTML = `
                <input type="checkbox" ${task.completed ? "checked" : ""}>
                <div class="task-info">
                    <div class="task-title"></div>
                    <div class="task-course">未分类</div>
                </div>
                <span class="task-status">${task.completed ? "已完成" : "进行中"}</span>
            `;

            newTask.querySelector(".task-title").textContent = task.name;

            // 勾选复选框时更新完成状态
            newTask.querySelector("input").addEventListener("change", function()
            {
                task.completed = this.checked;
                saveTasks();
                renderTasks();
            });

            taskList.appendChild(newTask);
        });
    }

    // 保存任务到浏览器
    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // 点击按钮，添加新任务
    addTaskBtn.addEventListener("click", function()
    {
        const taskName = prompt("请输入任务名称：");

        if (taskName && taskName.trim() !== "")
        {
            tasks.push({
                name: taskName.trim(),
                completed: false
            });

            saveTasks();
            renderTasks();
        }
    });

    // 打开网页时显示保存的任务
    renderTasks();
</script>
</body>
</html>
